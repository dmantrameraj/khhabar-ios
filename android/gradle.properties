# Windows-specific: Kotlin's incremental compiler crashes trying to compute
# a relative path when the Pub cache and this project live on different
# drive letters (an IllegalArgumentException with "different roots" —
# relative paths across drives are undefined on Windows). Disabling
# incremental compilation avoids that path-relativization step entirely.
# Safe to remove once PUB_CACHE and this project are confirmed to be on
# the same drive.
kotlin.incremental=false
