name: khhabar_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# The "+N" build number becomes Android's versionCode, and Play Console
# refuses any upload whose versionCode it has already seen — so this MUST
# be incremented for every single submission, including a resubmission
# after a policy rejection (1.0.0+1 was rejected 2026-09-24).
version: 1.0.1+2

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Networking + state management, per the project's chosen architecture.
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2 # renders article body HTML (from CKEditor) safely, no raw script execution
  share_plus: ^10.1.2 # native OS share sheet for articles
  flutter_secure_storage: ^9.2.2 # Keystore/Keychain-backed bearer token storage — never SharedPreferences for auth tokens
  onesignal_flutter: ^5.2.7 # push notifications — same OneSignal account the website already uses (Admin -> Push Notifications)
  app_links: ^6.3.2 # Android App Links / iOS Universal Links — khhabar.com/news/{slug} opens straight into the app
  google_mobile_ads: ^9.1.0 # AdMob banner ads — separate revenue channel from the website's own self-served ad system
  font_awesome_flutter: ^11.0.0 # real WhatsApp brand icon for the share buttons (Material Icons has no brand glyphs)
  image_picker: ^1.1.2 # reporter's "attach a photo" field on the submit-article screen
  flutter_tts: ^4.2.0 # "Listen to this article" narration — the app-side equivalent of the website's Web Speech API player
  shared_preferences: ^2.3.3 # plain-text local prefs — dark mode, article font size, favorite categories (nothing sensitive; auth token stays in flutter_secure_storage)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates every required launcher icon size (+ Android adaptive icon)
  # from one source image — dev-only, doesn't ship in the app itself.
  flutter_launcher_icons: ^0.14.3

  # Generates the native splash screen — dev-only. A hand-edited
  # launch_background.xml only covers Android <12; Android 12+ has its
  # own system Splash Screen API that ignores that file entirely unless
  # the app explicitly opts in via the android:windowSplashScreen* theme
  # attributes, which this package generates correctly (including
  # values-v31/styles.xml) for both cases in one step.
  flutter_native_splash: ^2.4.3

# Run `dart run flutter_native_splash:create` after changing
# assets/splash/khhabar_splash_logo.png to regenerate — see
# https://pub.dev/packages/flutter_native_splash.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/khhabar_splash_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/splash/khhabar_splash_logo.png"
  android: true
  ios: false
  web: false

# Run `dart run flutter_launcher_icons` after changing assets/icon/khhabar_logo.png
# to regenerate. See https://pub.dev/packages/flutter_launcher_icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/khhabar_logo.png"
  # The source logo already has a plain white background matching this,
  # so foreground and background line up seamlessly with no visible seam.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/khhabar_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # assets/icon/khhabar_logo.png is only used as flutter_launcher_icons'
  # build-time source (see the config block above) — not declared as a
  # runtime asset since nothing in the app displays it directly.
  #
  # assets/splash/khhabar_splash_logo.png IS a runtime asset (in addition
  # to being flutter_native_splash's source) — it's the same wordmark
  # shown in Home's AppBar (wrapped in a white badge; the source PNG has
  # an opaque white background baked in, not transparent, so it needs one).
  assets:
    - assets/splash/khhabar_splash_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
